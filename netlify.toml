[build]
  base = "frontend"
  command = "npm run build"
  publish = "build"

[build.environment]
  NODE_VERSION = "20"
  CI = "false"

# Proxy /api/* to the deployed Flask backend on Render
[[redirects]]
  from = "/api/*"
  to = "https://mm-eead.onrender.com/api/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
